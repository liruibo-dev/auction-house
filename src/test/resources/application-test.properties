# 测试专用的配置覆盖层。用法：测试类上加 @ActiveProfiles("test")
#
# 为什么叫 application-test.properties 而不是 application.properties？
# 因为 Maven 跑测试时，target/test-classes 排在 target/classes 前面。
# 如果测试目录里也叫 application.properties，它会把主配置整个"顶掉"，
# 数据库地址、账号、密码全丢了，测试连不上库。
# 换成 -test 后缀走 profile 机制，就是"在原有配置之上打补丁"，不会顶掉。
#
# ddl-auto 永远保持 update。哪怕这个库是测试专用、清空也不心疼，
# 也别改成 create-drop —— 养成危险习惯，哪天不小心抄回主配置，清的就是真实数据了。
spring.jpa.hibernate.ddl-auto=update

# 👉 测试连的是**独立的** auction_house_test 库，不是开发用的 auction_house。
#
# 2026-09-24 才改成这样。之前测试和开发共用一个库，踩的坑：
#   - 测试造的数据会出现在你自己的页面上
#   - 并发测试和结算测试必须"真提交"（不能靠事务回滚），万一清理失败就往真实库塞垃圾
#   - app 正在跑的时候跑测试，两个调度器会同时结算同一批拍卖，测试结果随机
#
# 换一台机器第一次跑测试前，先建库：
#   CREATE DATABASE auction_house_test DEFAULT CHARACTER SET utf8mb4;
# 表结构由 Hibernate 自动建（ddl-auto=update）。
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/auction_house_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}

# 跑一次测试要打几千行 insert SQL，把测试结果刷到找不着。关掉。
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 并发测试要让 50 个线程真的同时进数据库。
# Hikari 默认只给 10 个连接，那样实际并发度被压到 10，"同时抢"就假了。
spring.datasource.hikari.maximum-pool-size=60

# 关掉"每 5 秒自动结算"这个触发器。
# 它一开，测试自己造出来的"已到期"拍卖会被调度器抢先结掉（AuctionSettlementTest 就是造这种数据），
# 于是"结算成功"的断言随机失败。详细原因见 AuctionSettlementServiceImpl 的类注释。
auction.settlement.enabled=false
