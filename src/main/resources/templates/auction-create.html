<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>发布拍卖 - 实时拍卖行</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="navbar">
    <a class="brand" href="/">实时拍卖行</a>
    <div class="menu">
        <a href="/auctions">拍卖大厅</a>
        <a href="/auctions/create">发布拍卖</a>
        <a href="/my/auctions">我的拍卖</a>
    </div>
    <div class="menu" id="navUser"></div>
</div>

<div class="container">
    <div class="card form-card" style="max-width:520px;">
        <h1>发布拍卖</h1>

        <label for="itemName">物品名称</label>
        <input id="itemName" type="text" placeholder="例如：限量版机械键盘">

        <label for="description">物品描述</label>
        <textarea id="description" rows="3" placeholder="说说这件东西的成色、来历"></textarea>

        <label for="startPrice">起拍价（元）</label>
        <input id="startPrice" type="number" step="0.01" min="0.01" placeholder="例如：100">

        <label for="buyNowPrice">一口价（元，可留空）</label>
        <input id="buyNowPrice" type="number" step="0.01" min="0.01" placeholder="留空表示不设一口价">

        <label for="durationHours">拍卖时长（小时）</label>
        <input id="durationHours" type="number" min="1" value="24">

        <button id="submit" style="width:100%;">发布</button>
        <div class="msg" id="msg"></div>
    </div>
</div>

<script src="/app.js"></script>
<script>
    var button = document.getElementById("submit");
    var msg = document.getElementById("msg");

    button.onclick = function () {
        var buyNow = document.getElementById("buyNowPrice").value;

        button.disabled = true;
        msg.className = "msg";
        msg.innerText = "提交中...";

        post("/api/auctions", {
            itemName: document.getElementById("itemName").value,
            description: document.getElementById("description").value,
            startPrice: document.getElementById("startPrice").value,
            buyNowPrice: buyNow === "" ? null : buyNow,
            durationHours: Number(document.getElementById("durationHours").value)
        }).then(function (result) {
            button.disabled = false;
            if (result.code === 200) {
                msg.className = "msg ok";
                msg.innerText = result.message + "，正在跳转...";
                window.location.href = "/auctions/" + result.data.id;
            } else {
                msg.className = "msg err";
                msg.innerText = result.message;
            }
        }).catch(function () {
            button.disabled = false;
            msg.className = "msg err";
            msg.innerText = "请求失败，请确认服务已启动";
        });
    };
</script>
</body>
</html>
