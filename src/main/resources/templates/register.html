<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册 - 实时拍卖行</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="navbar">
    <a class="brand" href="/">实时拍卖行</a>
    <div class="menu">
        <a href="/auctions">拍卖大厅</a>
    </div>
    <div class="menu" id="navUser"></div>
</div>

<div class="container">
    <div class="card form-card">
        <h1>注册账号</h1>

        <label for="username">用户名</label>
        <input id="username" type="text" placeholder="请输入用户名">

        <label for="password">密码</label>
        <input id="password" type="password" placeholder="至少 6 位">

        <button id="submit" style="width:100%;">注册</button>
        <div class="msg" id="msg"></div>

        <p class="muted" style="text-align:center; margin-top:16px;">
            已有账号？<a href="/login">去登录</a>
        </p>
    </div>
</div>

<script src="/app.js"></script>
<script>
    var button = document.getElementById("submit");
    var msg = document.getElementById("msg");

    button.onclick = function () {
        button.disabled = true;
        msg.className = "msg";
        msg.innerText = "提交中...";

        post("/api/users/register", {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
        }).then(function (result) {
            button.disabled = false;
            if (result.code === 200) {
                msg.className = "msg ok";
                msg.innerText = result.message + "，正在跳转登录页...";
                setTimeout(function () {
                    window.location.href = "/login";
                }, 900);
            } else {
                msg.className = "msg err";
                msg.innerText = result.message;
            }
        }).catch(function () {
            button.disabled = false;
            msg.className = "msg err";
            msg.innerText = "请求失败，请确认服务已启动";
        });
    };
</script>
</body>
</html>
