# 数据库连接写成 ${环境变量:默认值} 的形式：
#   本地开发 —— 不设环境变量，直接用冒号后面的默认值，跟以前一样能跑
#   部署上线 —— 启动时用环境变量覆盖，真实密码不写进仓库
#     比如：DB_PASSWORD=xxxx java -jar auction-house.jar
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auction_house?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

spring.thymeleaf.cache=false